<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101315"><title>WANTED CONTROL</title><script src="./config.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% -180px,#3b414555,transparent 70%),#0c0e10;color:#eef0ed;font:14px Inter,system-ui,Segoe UI,sans-serif}button,input,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.5;cursor:wait}.shell{max-width:1060px;width:calc(100% - 30px);margin:auto;padding:22px 0 32px}.top{display:flex;align-items:center;justify-content:space-between;padding-bottom:17px;border-bottom:1px solid #ffffff18}.brand{display:flex;align-items:center;gap:12px;color:white;text-decoration:none}.mark{display:grid;place-items:center;width:41px;height:41px;border:1px solid #ffffff4c;background:linear-gradient(145deg,#454b4e,#171b1d);font-size:24px;font-weight:950;font-style:italic}.brand b{display:block;font-size:12px;letter-spacing:.18em}.brand small{display:block;margin-top:4px;color:#7e878b;font-size:8px;letter-spacing:.16em}.muted{color:#929a9d;font-size:11px;line-height:1.7}.k{color:#929a9d;font-size:8px;font-weight:900;letter-spacing:.19em}.panel,.login,.widget{border:1px solid #ffffff18;background:linear-gradient(145deg,#252a2d,#171b1d);box-shadow:0 18px 50px #0003}.login{max-width:460px;margin:65px auto;padding:28px}.h{margin:9px 0;color:#f1f3ef;font-size:29px;font-weight:900;letter-spacing:-.04em}.form{display:grid;gap:9px;margin-top:22px}.form label,.label{color:#a5adaf;font-size:8px;font-weight:900;letter-spacing:.13em}.input,select{width:100%;height:42px;padding:0 11px;border:1px solid #ffffff20;background:#101315;color:#eef0ed}.btn{min-height:39px;padding:0 14px;border:1px solid #ffffff22;background:#292f32;color:#f1f2ef;font-size:9px;font-weight:900;letter-spacing:.1em}.primary{background:linear-gradient(#e3e6e2,#c5cac6);border-color:#eef0ec;color:#15191a}.quiet{background:#ffffff08}.danger{border-color:#d77b754b;background:#8c302922;color:#e28d85}.full{width:100%;margin-top:9px}.notice{display:none;margin-top:11px;color:#9fc8a8;font-size:11px;line-height:1.6}.notice.show{display:block}.notice.bad{color:#e38c84}.head{display:flex;align-items:end;justify-content:space-between;gap:15px;margin:30px 0 19px}.head h1{margin:7px 0;font-size:28px;letter-spacing:-.04em}.create{display:flex;align-items:center;justify-content:space-between;gap:15px;padding:17px 18px;margin-bottom:24px}.create form{display:flex;gap:7px;width:min(410px,58%)}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.widget{padding:16px}.widget h3{margin:12px 0}.meta{display:flex;justify-content:space-between;padding-top:10px;margin-top:10px;border-top:1px solid #ffffff18;color:#899195;font-size:8px}.meta b{color:#dfe3df}.widget .btn{margin-top:12px;width:100%}.layout{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:13px}.col{display:grid;gap:13px}.panel{padding:18px}.panel h2{margin:6px 0 15px;font-size:16px}.readout{font-size:54px;font-weight:950;letter-spacing:-.08em}.readout span{color:#747d81;font-size:18px}.stars{display:flex;justify-content:center;align-items:center;gap:var(--gap,5px);height:88px;overflow:hidden}.star{width:var(--size,48px);height:var(--size,48px);flex:none;filter:drop-shadow(0 2px 2px #000b)}.star path{fill:var(--empty,#303538);stroke:var(--outline,#111416);stroke-width:4;stroke-linejoin:round}.star.on path{fill:var(--active,#f2f3ef)}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.quick{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-top:9px}.quick button{height:36px;border:1px solid #ffffff20;background:#111517;color:#c9cfcb;font-weight:900}.quick .sel{background:#dfe3df;color:#15191a}.settings{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:14px 0}.settings label{display:grid;gap:7px;color:#a5adaf;font-size:8px;font-weight:900}.settings input[type=color]{width:100%;height:34px;background:#101315;border:1px solid #ffffff20}.settings input[type=range]{accent-color:#e2e5e1;width:100%}.settings input[type=number],.settings select{height:34px;width:100%;background:#101315;color:white;border:1px solid #ffffff20}.check{display:flex!important;align-items:center;justify-content:space-between;grid-column:1/-1;padding:7px 0;border-bottom:1px solid #ffffff18}.check input{accent-color:#ddd}.copy{display:flex;gap:7px}.copy input{min-width:0;flex:1;height:38px;background:#101315;border:1px solid #ffffff20;color:#dce1dc;padding:0 9px;font-size:9px}.small{color:#758085;font-size:8px;line-height:1.7}.dangerbox{border-color:#cf696333}.hide{display:none!important}.display,body.display{width:600px;height:120px;min-width:0;min-height:0;overflow:hidden;background:transparent!important;margin:0}.display .shell,.display .top,.display main{width:600px;height:120px;padding:0;margin:0;background:transparent;box-shadow:none;border:0}.display .stars{height:120px}.display .star{width:79px;height:79px}footer{display:flex;justify-content:space-between;margin-top:25px;color:#566065;font-size:8px;letter-spacing:.14em}@media(max-width:760px){.grid{grid-template-columns:repeat(2,1fr)}.layout{grid-template-columns:1fr}.head{align-items:flex-start}.create{align-items:stretch;flex-direction:column}.create form{width:100%}}@media(max-width:520px){.grid{grid-template-columns:1fr}.login{margin:35px auto;padding:22px}.head{flex-direction:column}.create form,.copy{flex-direction:column}.create form .btn,.copy .btn{width:100%}.settings{grid-template-columns:1fr 1fr}}
</style></head><body><div id="app"></div>
<script type="module">
import{createClient}from'https://esm.sh/@supabase/supabase-js@2';
const cfg=window.WANTED_CONFIG||{},db=cfg.url&&cfg.key?createClient(cfg.url,cfg.key,{auth:{persistSession:false,autoRefreshToken:false}}):null,app=document.querySelector('#app'),q=new URLSearchParams(location.search),view=q.get('view')||'login',sk='wanted-admin-session';let session=sessionStorage.getItem(sk)||'',widget=null,channel=null,busy=false;
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const link=(v,args={})=>{let u=new URL(location.href);u.search='';u.searchParams.set('view',v);for(let[k,x]of Object.entries(args))u.searchParams.set(k,x);return u.href};
async function rpc(fn,args={}){if(!db)throw Error('Не настроен Supabase. Добавьте URL и Publishable Key в GitHub Actions.');let{data,error}=await db.rpc(fn,args);if(error)throw Error(error.message);return data}
function flash(t,b=false){let n=$('#notice');if(n){n.textContent=t;n.className='notice show'+(b?' bad':'')}}
function shell(html){document.body.className='';app.innerHTML='<div class="shell"><header class="top"><a class="brand" href="'+link('dashboard')+'"><span class="mark">W</span><span><b>WANTED CONTROL</b><small>REMOTE HUD MANAGEMENT</small></span></a><span class="k">PRIVATE ACCESS</span></header>'+html+'<footer><span>WANTED CONTROL SYSTEM</span><span>OBS BROWSER SOURCE</span></footer></div>'}
function stars(level,s={},display=false){return '<div class="stars" style="--gap:'+(s.gap??5)+'px;--size:'+(display?'79px':'48px')+';--active:'+(s.activeColor||'#f2f3ef')+';--empty:'+(s.inactiveColor||'#303538')+';--outline:'+(s.outlineColor||'#111416')+'">'+[0,1,2,3,4].map(i=>'<svg class="star '+(i<level?'on':'')+'" viewBox="0 0 100 100"><path d="M50 3.5 61.1 36.2 96 36.2 67.8 56.7 78.6 90.2 50 69.6 21.4 90.2 32.2 56.7 4 36.2 38.9 36.2Z"/></svg>').join('')+'</div>'}
function login(){shell('<section class="login"><div class="k">PRIVATE ACCESS / 01</div><h1 class="h">Вход в систему</h1><p class="muted">Войдите, чтобы создавать отдельные OBS-виджеты и управлять каждым профилем.</p><form id="login" class="form"><label>ИМЯ ПОЛЬЗОВАТЕЛЯ</label><input class="input" name="username" value="cjlakc" required><label>ПАРОЛЬ</label><input class="input" name="password" type="password" required><button class="btn primary full">ВОЙТИ В ПАНЕЛЬ ↗</button></form><div id="notice" class="notice"></div></section>');$('#login').onsubmit=async e=>{e.preventDefault();let b=e.submitter;b.disabled=true;try{let f=new FormData(e.currentTarget),t=await rpc('admin_login',{p_username:f.get('username'),p_password:f.get('password')});if(!t)throw Error('Неверное имя пользователя или пароль.');session=t;sessionStorage.setItem(sk,t);location.href=link('dashboard')}catch(x){flash(x.message,true);b.disabled=false}}}
async function logout(){try{await rpc('admin_logout',{p_session_token:session})}catch{}session='';sessionStorage.removeItem(sk);location.href=link('login')}
async function dashboard(){let list=await rpc('admin_list_widgets',{p_session_token:session});shell('<div class="head"><div><div class="k">CONTROL CENTER / 02</div><h1>Мои виджеты</h1><p class="muted">Отдельная OBS-ссылка, состояние и настройки для каждого профиля.</p></div><button class="btn quiet" id="logout">ВЫЙТИ</button></div><section class="panel create"><div><div class="k">NEW PROFILE</div><b>Создать виджет</b><p class="muted">Новый независимый профиль управления.</p></div><form id="create"><input class="input" name="name" value="Мой Wanted Level" maxlength="60"><button class="btn primary">＋ СОЗДАТЬ</button></form></section><div class="head"><span class="k">СОЗДАННЫЕ ПРОФИЛИ · '+list.length+'</span></div><section class="grid">'+(list.length?list.map(w=>'<article class="widget"><div class="k">PROFILE · '+w.id.slice(0,8)+'</div><h3>'+esc(w.name)+'</h3><div class="meta"><span>WANTED LEVEL</span><b>'+w.level+'/5</b></div>'+stars(w.level,w.settings)+'<button class="btn" data-open="'+w.id+'">УПРАВЛЯТЬ ↗</button></article>').join(''):'<div class="widget">Профилей пока нет. Создайте первый виджет.</div>')+'</section><div id="notice" class="notice"></div><section class="panel" style="margin-top:18px"><div class="k">ACCOUNT SECURITY</div><h3>Изменить пароль</h3><form id="pw" class="form"><input class="input" name="old" type="password" placeholder="Текущий пароль" required><input class="input" name="next" type="password" minlength="16" placeholder="Новый пароль (16+ символов)" required><input class="input" name="again" type="password" minlength="16" placeholder="Повтор нового пароля" required><button class="btn primary">СОХРАНИТЬ</button></form></section>');$('#logout').onclick=logout;$('#create').onsubmit=async e=>{e.preventDefault();try{let w=await rpc('admin_create_widget',{p_session_token:session,p_name:new FormData(e.currentTarget).get('name')});location.href=link('widget',{id:w.id})}catch(x){flash(x.message,true)}};document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>location.href=link('widget',{id:b.dataset.open}));$('#pw').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.currentTarget);if(f.get('next')!==f.get('again'))return flash('Пароли не совпадают.',true);try{await rpc('admin_change_password',{p_session_token:session,p_current_password:f.get('old'),p_new_password:f.get('next')});flash('Пароль изменён. Войдите снова.');setTimeout(logout,800)}catch(x){flash(x.message,true)}}}
function settings(s){s={scale:1,gap:5,activeColor:'#f2f3ef',inactiveColor:'#303538',outlineColor:'#111416',glow:true,animations:true,finalFlash:true,canvasWidth:600,canvasHeight:120,alignment:'center',...s};return '<div class="settings"><label>МАСШТАБ<input name="scale" type="range" min=".5" max="1.8" step=".05" value="'+s.scale+'"></label><label>ИНТЕРВАЛ<input name="gap" type="range" min="0" max="24" value="'+s.gap+'"></label>'+[['activeColor','АКТИВНАЯ ЗВЕЗДА'],['inactiveColor','ПУСТАЯ ЗВЕЗДА'],['outlineColor','КОНТУР']].map(([n,t])=>'<label>'+t+'<input type="color" name="'+n+'" value="'+s[n]+'"></label>').join('')+'<label>ВЫРАВНИВАНИЕ<select name="alignment"><option value="center">По центру</option><option value="left" '+(s.alignment==='left'?'selected':'')+'>Слева</option><option value="right" '+(s.alignment==='right'?'selected':'')+'>Справа</option></select></label><label>ШИРИНА<input name="canvasWidth" type="number" min="200" max="1400" value="'+s.canvasWidth+'"></label><label>ВЫСОТА<input name="canvasHeight" type="number" min="80" max="500" value="'+s.canvasHeight+'"></label>'+[['glow','Свечение'],['animations','Анимации'],['finalFlash','Вспышка 5/5']].map(([n,t])=>'<label class="check">'+t+'<input type="checkbox" name="'+n+'" '+(s[n]?'checked':'')+'></label>').join('')+'</div>'}
async function profile(id){widget=await rpc('admin_get_widget',{p_session_token:session,p_widget_id:id});let w=widget;const obs=()=>link('display',{token:widget.display_token});shell('<div class="head"><div><a href="'+link('dashboard')+'" class="k">← ВСЕ ПРОФИЛИ</a><h1>'+esc(w.name)+'</h1><p class="muted">Управление состоянием, внешним видом и OBS-подключением.</p></div><button id="logout" class="btn quiet">ВЫЙТИ</button></div><div class="layout"><div class="col"><section class="panel"><div class="k">LIVE CONTROL</div><h2>Уровень розыска</h2><div class="readout"><b id="lvl">'+w.level+'</b><span>/ 5</span></div><div id="stars">'+stars(w.level,w.settings)+'</div><div class="actions"><button id="down" class="btn">−1 STAR</button><button id="up" class="btn primary">＋1 STAR</button></div><div class="quick">'+[0,1,2,3,4,5].map(n=>'<button data-level="'+n+'" class="'+(n===w.level?'sel':'')+'">'+n+'</button>').join('')+'</div><button id="reset" class="btn quiet full">↺ RESET 0/5</button><div id="notice" class="notice"></div></section><section class="panel"><div class="k">APPEARANCE / FULL CONTROL</div><h2>Настройки виджета</h2><form id="settings-form"><label class="label">НАЗВАНИЕ ПРОФИЛЯ</label><input class="input" name="name" maxlength="60" value="'+esc(w.name)+'">'+settings(w.settings)+'<button class="btn primary full">СОХРАНИТЬ НАСТРОЙКИ</button></form></section><section class="panel"><div class="k">OBS BROWSER SOURCE</div><h2>Ссылка для OBS</h2><p class="muted">Публичная ссылка только для отображения звёзд, без доступа к управлению.</p><div class="copy"><input id="obs" readonly value="'+esc(obs())+'"><button id="copy" class="btn primary">КОПИРОВАТЬ</button></div><p class="small">Прозрачный фон · 600×120 (или выбранный размер)</p><button id="rotate" class="btn quiet full">ОБНОВИТЬ OBS-ССЫЛКУ ↻</button></section></div><aside class="col"><section class="panel"><div class="k">LIVE PREVIEW</div><h2>Предпросмотр HUD</h2><div id="mini">'+stars(w.level,w.settings,true)+'</div></section><section class="panel dangerbox"><div class="k">DANGER ZONE</div><h2>Удалить профиль</h2><p class="muted">Удаление отключит OBS-ссылку и удалит настройки и состояние.</p><button id="delete" class="btn danger full">УДАЛИТЬ ВИДЖЕТ</button></section></aside></div>');$('#logout').onclick=logout;
function paint(n){if(!n)return;widget={...widget,...n};$('#lvl').textContent=widget.level;$('#stars').innerHTML=stars(widget.level,widget.settings);$('#mini').innerHTML=stars(widget.level,widget.settings,true);$('#obs').value=obs();document.querySelectorAll('[data-level]').forEach(b=>b.classList.toggle('sel',+b.dataset.level===widget.level))}
async function change(a,l){if(busy)return;busy=true;try{paint(await rpc('admin_change_level',{p_session_token:session,p_widget_id:id,p_action:a,p_level:l}));flash('Изменение синхронизировано с OBS.')}catch(x){flash(x.message,true)}busy=false}
$('#up').onclick=()=>change('up');$('#down').onclick=()=>change('down');$('#reset').onclick=()=>change('reset');document.querySelectorAll('[data-level]').forEach(b=>b.onclick=()=>change('set',+b.dataset.level));
$('#settings-form').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.currentTarget),s={};['scale','gap','canvasWidth','canvasHeight'].forEach(k=>s[k]=+f.get(k));['activeColor','inactiveColor','outlineColor','alignment'].forEach(k=>s[k]=f.get(k));['glow','animations','finalFlash'].forEach(k=>s[k]=f.has(k));try{paint(await rpc('admin_save_widget',{p_session_token:session,p_widget_id:id,p_name:f.get('name'),p_settings:s}));flash('Настройки сохранены.')}catch(x){flash(x.message,true)}};
$('#copy').onclick=async()=>{try{await navigator.clipboard.writeText($('#obs').value);flash('OBS-ссылка скопирована.')}catch{$('#obs').select();flash('Ссылка выделена для копирования.')}};$('#rotate').onclick=async()=>{if(!confirm('Старый OBS URL перестанет работать. Продолжить?'))return;try{paint(await rpc('admin_rotate_display_token',{p_session_token:session,p_widget_id:id}));flash('Ссылка обновлена.')}catch(x){flash(x.message,true)}};$('#delete').onclick=async()=>{if(confirm('Удалить этот профиль без возможности восстановления?'))try{await rpc('admin_delete_widget',{p_session_token:session,p_widget_id:id});location.href=link('dashboard')}catch(x){flash(x.message,true)}};
channel=db.channel('wanted:'+w.display_token).on('broadcast',{event:'state'},({payload})=>paint(payload)).subscribe();setInterval(async()=>{try{let n=await rpc('admin_get_widget',{p_session_token:session,p_widget_id:id});if(n.updated_at!==widget.updated_at)paint(n)}catch{}},12000);window.addEventListener('beforeunload',()=>db.removeChannel(channel),{once:true})}
async function display(t){document.body.className='display';app.innerHTML='<main id="screen" style="width:600px;height:120px;display:flex;align-items:center;justify-content:center"></main>';if(!db||!t)return;let draw=s=>{if(!s)return;let c=$('#screen'),v=s.settings||{};c.style.width=(v.canvasWidth||600)+'px';c.style.height=(v.canvasHeight||120)+'px';c.style.justifyContent=v.alignment==='left'?'flex-start':v.alignment==='right'?'flex-end':'center';c.innerHTML=stars(s.level,v,true)};let load=async()=>{try{draw(await rpc('get_display_state',{p_display_token:t}))}catch{}};db.channel('wanted:'+t).on('broadcast',{event:'state'},({payload})=>draw(payload)).subscribe(s=>{if(s==='SUBSCRIBED')load()});load();setInterval(load,12000)}
async function main(){if(view==='display'){await display(q.get('token'));return}if(!db){login();return}if(!session||!await rpc('admin_validate_session',{p_session_token:session}).catch(()=>false)){session='';sessionStorage.removeItem(sk);login();return}if(view==='widget'&&q.get('id'))await profile(q.get('id'));else await dashboard()}main().catch(e=>{sessionStorage.removeItem(sk);session='';login();});
</script></body></html>
